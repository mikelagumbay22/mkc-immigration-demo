<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Login | MKC Immigration Solutions Inc (demo concept)</title>
<link rel="icon" href="assets/favicon.ico"><link rel="stylesheet" href="assets/style.css?v=20261019d"><link rel="stylesheet" href="assets/dashboard.css?v=20261019d"></head>
<body><div class="demo">Demo concept — not the official site</div>
<main style="max-width:520px;margin:40px auto;padding:0 20px">
<a href="index.html"><img src="assets/logo-lockup.svg" alt="MKC Immigration Solutions Inc" width="290" height="89" style="max-width:100%;height:auto"></a>
<h1 style="font-family:Georgia,serif;color:#0a1f3d;margin:20px 0 16px">Login</h1>
<div class="card" role="note"><p style="margin:0"><strong>Sample client:</strong> client@demo.ca / client123<br><strong>Sample owner:</strong> owner@demo.ca / owner123</p></div>
<form id="loginForm" class="card" style="margin-top:18px" novalidate>
<label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<p id="loginError" class="login-error" role="alert" aria-live="assertive"></p>
<button class="btn navy login-submit" type="submit">Sign in</button>
<p style="margin:16px 0 0"><a href="index.html">← Back to public site</a></p></form></main>
<footer class="mini-footer" style="max-width:520px;margin:0 auto 32px;padding:0 20px"><p class="policy-links"><a href="privacy.html">Privacy Policy</a><span class="sep" aria-hidden="true">|</span><a href="cookies.html">Cookies Policy</a></p><p class="mini-disc">Demo concept, not affiliated with or approved by MKC Immigration Solutions Inc.</p></footer>
<script>
(function(){var f=document.getElementById('loginForm');
f.addEventListener('submit',function(e){e.preventDefault();var em=document.getElementById('email').value.trim().toLowerCase(),pw=document.getElementById('password').value;
if(em==='client@demo.ca'&&pw==='client123'){sessionStorage.setItem('mkc_demo_role','client');location.href='client/dashboard.html';}
else if(em==='owner@demo.ca'&&pw==='owner123'){sessionStorage.setItem('mkc_demo_role','owner');location.href='owner/dashboard.html';}
else{document.getElementById('loginError').textContent='Incorrect email or password. Use one of the sample accounts shown above.';}});})();
</script></body></html>
